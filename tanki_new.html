function musicTick(){ if(!AC||!MUS.song)return; if(AC.state!=='running')return; const sp=60/MUS.song.tempo/4;
  if(MUS.next<AC.currentTime-0.3) MUS.next=AC.currentTime+0.05;
  while(MUS.next<AC.currentTime+0.15){ if(settings.music>0.01) scheduleStep(MUS.step,MUS.next); MUS.step=(MUS.step+1)%64; MUS.next+=sp; } }

function engineSet(level){
  if(!AC) return;
  if(!eng){ const o=AC.createOscillator(), o2=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='sawtooth'; o2.type='square'; f.type='lowpass'; f.frequency.value=220; g.gain.value=0; o.connect(f); o2.connect(f); f.connect(g).connect(sfxGain); o.start(); o2.start(); eng={o,o2,f,g}; }
  const t=AC.currentTime;
  eng.o.frequency.setTargetAtTime(38+level*34,t,0.12); eng.o2.frequency.setTargetAtTime(19+level*17,t,0.12);
  eng.g.gain.setTargetAtTime(level>0?0.018+level*0.02:0,t,0.15);
}

function renderWalls(){

  c.globalAlpha=0.38; c.drawImage(shadowC,0,0,FW*RS,FH*RS,0,0,FW,FH); c.globalAlpha=1;
  const wc=curTheme.water;
  for(let cy=0;cy<GH;cy++)for(let cx=0;cx<GW;cx++){ const v=terr[cy*GW+cx]; if(!v)continue; const px=cx*T,py=cy*T;
    if(v===BR) drawBrickCell(c,px,py,cx,cy);

    else if(v===BG) drawBridgeCell(c,px,py,cx,cy);
    else if(v===WA){ const wp=texPat(c,tv(curTheme.lava?'lava':'water'),curTheme.lava?96:128); c.fillStyle=wp||wc[0]; c.fillRect(px,py,8,8); if(wp&&!curTheme.lava) texTint(c,px,py,8,8,wc[0],0.45);

  fctx.clearRect(0,0,FW,FH);
  const fo=curTheme.forest;
  for(let cy=0;cy<GH;cy++)for(let cx=0;cx<GW;cx++){ if(terr[cy*GW+cx]!==FO)continue; const px=cx*T+4,py=cy*T+4, h=hashR(cx,cy);

  for(let cy=0;cy<GH;cy++)for(let cx=0;cx<GW;cx++){ if(terr[cy*GW+cx]!==FO)continue; const h=hashR(cx,cy), px=cx*T+4+(h-0.5)*2,py=cy*T+4+((h*13)%1-0.5)*2, rad=4.6+h*1.6;

      fctx.globalCompositeOperation='multiply'; fctx.fillStyle=TEX.forest?'#c8d8c0':fo[1]; fctx.fillRect(px-rad,py-rad,rad*2,rad*2); fctx.globalCompositeOperation='source-over';
      const g=fctx.createRadialGradient(px-1.8,py-1.8,0.3,px,py,rad); g.addColorStop(0,'rgba(255,255,220,0.22)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,18,0,0.6)'); fctx.fillStyle=g; fctx.fillRect(px-rad,py-rad,rad*2,rad*2); fctx.restore(); continue; }

    fctx.fillStyle=g; fctx.beginPath(); fctx.arc(px,py,rad,0,7); fctx.fill();

}
function drawWaterAnim(t){
  if(!waterCells.length)return;
  const lava=curTheme.lava, hi=curTheme.water[1];
  ctx.fillStyle=hi;
  for(let i=0;i<waterCells.length;i+=2){ const cx=waterCells[i], cy=waterCells[i+1], px=cx*T, py=cy*T;
    const ph=(t*1.6+cx*0.35+cy*0.9)%4;
    ctx.globalAlpha=lava?0.35+0.25*Math.sin(t*3+cx*0.7+cy*0.5):0.45;

  ctx.globalAlpha=1;
  if(lava){ ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,90,0,0.05)'; for(let i=0;i<waterCells.length;i+=2) ctx.fillRect(waterCells[i]*T-2,waterCells[i+1]*T-2,12,12); ctx.globalCompositeOperation='source-over'; }

let parts=[];
function addP(p){ if(LOWFX()){ if(parts.length>320||(p.type==='smoke'&&Math.random()<0.6))return; } if(parts.length<1800) parts.push(p); }
function puff(x,y,n,col='rgba(90,90,90,',sz=4,sp=20,life=0.8){ for(let i=0;i<n;i++){ const a=Math.random()*7, v=Math.random()*sp; addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(0.6+Math.random()*0.6),max:life,size:sz*(0.6+Math.random()*0.8),grow:8,type:'smoke',col}); } }
function sparks(x,y,n,col='#ffd060',sp=120,life=0.35){ for(let i=0;i<n;i++){ const a=Math.random()*7, v=sp*(0.3+Math.random()*0.7); addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(0.5+Math.random()*0.8),max:life,size:1.2+Math.random(),type:'spark',col,drag:3}); } }
function debris(x,y,n,col,sp=90){ for(let i=0;i<n;i++){ const a=Math.random()*7, v=sp*(0.3+Math.random()*0.7); addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.5+Math.random()*0.5,max:1,size:1.2+Math.random()*1.6,type:'debris',col,drag:4,rot:Math.random()*6,vr:(Math.random()-0.5)*20}); } }
function explosion(x,y,size=1){
  gLight(x,y,60+50*size,[1,0.62,0.25],0.7+size*0.45,0.3+0.22*size); if(size>=0.7){ gWave(x,y,size); gHeat(x,y,30+30*size,1.2+size*0.6); } if(size>=1.2) gKick(0.6*size,size>=2?0.35:0.12);
  if(size>=0.8&&!LOWFX()){ for(let i=0;i<6*size;i++){ const a=Math.random()*7, v=rand(20,60)*size; addP({x:x+rand(-6,6)*size,y:y+rand(-6,6)*size,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,life:0.6+Math.random()*0.5,max:1,size:(7+Math.random()*7)*size,type:'fire',drag:3}); }
    for(let i=0;i<10*size;i++){ const a=Math.random()*7, v=rand(80,220)*size; addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.6+Math.random()*0.8,max:1.4,size:1.4,type:'ember',drag:1.8}); }
    for(let i=0;i<5*size;i++) addP({x:x+rand(-10,10)*size,y:y+rand(-10,10)*size,vx:rand(-8,8),vy:rand(-22,-8),life:1.8+Math.random(),max:2.8,size:(6+Math.random()*5)*size,grow:10,type:'smoke',col:'rgba(28,24,22,'}); }
  addP({x,y,vx:0,vy:0,life:0.18,max:0.18,size:22*size,type:'flash'});
  addP({x,y,vx:0,vy:0,life:0.45,max:0.45,size:28*size,type:'ring'});
  if(size>=1.2){ addP({x,y,vx:0,vy:0,life:0.7,max:0.7,size:60*size,type:'ring'}); addP({x,y,vx:0,vy:0,life:0.12,max:0.12,size:60*size,type:'flash'}); if(typeof M!=='undefined'&&M){ M.shake=Math.max(M.shake||0,3*size); for(let q=0;q<4;q++) rumble(q,140*size,0.25*size); } }
  for(let i=0;i<14*size;i++){ const a=Math.random()*7, v=(30+Math.random()*80)*size; addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.3+Math.random()*0.35,max:0.6,size:(5+Math.random()*6)*size,type:'fire',drag:4}); }

function smallHit(x,y,col='#ffd080'){ gLight(x,y,30,[1,0.8,0.5],0.5,0.1); addP({x,y,vx:0,vy:0,life:0.1,max:0.1,size:8,type:'flash'}); sparks(x,y,6,col,100,0.25); puff(x,y,2,'rgba(120,110,100,',3,15,0.5); }
function updateParts(dt){
  for(const p of parts){ if(p.type==='turret'){ p.vz-=420*dt; p.z+=p.vz*dt; if(p.z<0){ p.z=0; p.vz*=-0.3; p.vx*=0.5; p.vy*=0.5; p.vr*=0.5; } if(Math.random()<0.5) parts.push({x:p.x,y:p.y-p.z,vx:0,vy:-10,life:0.8,max:0.8,size:2,grow:6,type:'smoke',col:'rgba(40,36,34,'}); }
    p.life-=dt; if(p.drag){p.vx*=Math.max(0,1-p.drag*dt);p.vy*=Math.max(0,1-p.drag*dt);} p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.grow)p.size+=p.grow*dt; if(p.vr)p.rot+=p.vr*dt; }
  parts=parts.filter(p=>p.life>0);
}
function drawParts(layer){
  for(const p of parts){ const k=p.life/p.max;
    if(layer==='under'){ if(p.type!=='smoke')continue; ctx.fillStyle=p.col+(0.45*k).toFixed(3)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); continue; }
    if(p.type==='turret'){ drawTurretPart(p); continue; }
    if(p.type==='debris'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.min(1,k*2); ctx.fillStyle=p.col; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); }
  }
  ctx.globalAlpha=1;
  if(layer==='under')return;
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ const k=p.life/p.max;
    if(p.type==='fire'){ const r=p.size*(0.5+k*0.7); const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r); g.addColorStop(0,`rgba(255,240,180,${0.9*k})`); g.addColorStop(0.4,`rgba(255,140,30,${0.7*k})`); g.addColorStop(1,'rgba(160,30,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill(); }
    else if(p.type==='spark'){ ctx.strokeStyle=p.col; ctx.globalAlpha=k; ctx.lineWidth=p.size; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03); ctx.stroke(); ctx.globalAlpha=1; }
    else if(p.type==='ember'){ ctx.strokeStyle=`rgba(255,${160+Math.floor(80*k)},60,${k})`; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.05,p.y-p.vy*0.05); ctx.stroke(); }
    else if(p.type==='flash'){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size); g.addColorStop(0,`rgba(255,255,230,${k})`); g.addColorStop(1,'rgba(255,200,100,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
    else if(p.type==='ring'){ ctx.strokeStyle=`rgba(255,220,160,${0.5*k})`; ctx.lineWidth=2.5*k; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1-k)+3,0,7); ctx.stroke(); }
    else if(p.type==='glow'){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size); g.addColorStop(0,p.col.replace('A',(k*0.8).toFixed(2))); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
  }
  ctx.globalCompositeOperation='source-over';
}

      else { const x=cx+DX[b.dir]*d; for(let y=Math.floor((b.y-16)/T);y<=Math.floor((b.y+15.9)/T);y++){const v=tget(x,y); if(v===BR){tset(x,y,E);brick=true;} else if(v===ST) stHit(x,y); } }
    }

function updateBullets(dt){

    }

  // камикадзе
  if(e.type===7){
    e.role='hunter'; aiDrive(e,sp,dt);
    const cx=e.x+16, cy=e.y+16;
    if(Math.random()<0.5) addP({x:cx-DX[e.dir]*14,y:cy-DY[e.dir]*14,vx:rand(-10,10),vy:rand(-10,10),life:0.3,max:0.3,size:3,type:'fire',drag:2});
    let boom=!M.noBase&&dist(cx,cy,208,400)<34;
    if(M.truck&&!M.truck.dead&&dist(cx,cy,M.truck.x+16,M.truck.y+16)<32) boom=true;
    for(const pl of M.players) if(pl&&pl.state==='alive'&&dist(cx,cy,pl.x+16,pl.y+16)<30) boom=true;

  }
  const smart=e.type!==8&&e.type!==9&&e.role!=='roam';
  if(!(smart&&aiDrive(e,sp,dt))){
  if(moveTank(e,sp*dt)) e.blockedT=0;
  else { e.blockedT+=dt; if(e.blockedT>0.2){ if(Math.random()<0.5&&e.cool<=0) enemyShoot(e); enemyNewDir(e,true); e.blockedT=0; e.dirT=rand(1,3);} }
  e.dirT-=dt; if(e.dirT<=0){enemyNewDir(e,false);e.dirT=rand(1.2,3.5);}
  }

  if(e.type===8){ if(e.cool<=0){ const p=nearestPlayer(e); const tgt=(M.truck&&!M.truck.dead&&Math.random()<0.5)?{x:M.truck.x+16,y:M.truck.y+16}:(p&&(Math.random()<0.7||M.noBase))?{x:p.x+16,y:p.y+16}:{x:208,y:400};

  if(e.type===13&&e.specT<=0){ const p=nearestPlayer(e); const near=p&&dist(p.x,p.y,e.x,e.y)<120; if(near||e.blockedT>0.1||(M.truck&&!M.truck.dead&&dist(M.truck.x,M.truck.y,e.x,e.y)<110)){ if(placeBomb({x:e.x+16,y:e.y+16,owner:e,team:'e',range:2+Math.floor(M.L/30),dmgP:2.5*M.dmgK,fuse:2.2})){ e.specT=rand(3.5,5.5); const back=(e.dir+2)%4; turn(e,tankRectFree(e,e.x+DX[back]*4,e.y+DY[back]*4)?back:(e.dir+1)%4); e.dodgeT=0.7; e.lastNode=-1; } } else e.specT=0.4; }
  if(e.type===5&&e.specT<=0&&e.mines<4){ e.specT=rand(4,7); e.mines++; M.mines.push({x:e.x+16-DX[e.dir]*14,y:e.y+16-DY[e.dir]*14,team:'e',owner:e,arm:1,dmgP:2*M.dmgK}); }
  if(e.type===11){ if(e.cool<=0){ const p=nearestPlayer(e); if(p&&dist(p.x,p.y,e.x,e.y)<260) enemyShoot(e); else e.cool=1; } return; }
  if(e.type>=14&&enemySpecial(e,dt)) return;
  e.fireT-=dt;
  if(e.fireT<=0){ if(e.cool<=0) enemyShoot(e); e.fireT=rand(0.6,1.8)*Math.max(0.5,1-0.004*M.L); }
  else if(e.cool<=0&&Math.random()<0.1&&enemyWantsShoot(e)) enemyShoot(e);
}

function bossTarget(b){ const p=nearestPlayer(b); return p?{x:p.x+16,y:p.y+16}:{x:208,y:400}; }
function updateBoss(b,dt){
  const k=b.hp/b.maxHp; if(k<0.5&&b.phase===1){ b.phase=2; M.banner={t:2,title:b.name+' В ЯРОСТИ!',sub:'',col:'#ff6030'}; SFX.roar(); }

  b.t1-=dt; b.t2-=dt; b.t3-=dt;
  // движение
  if(b.charge>0){ b.charge-=dt; const moved=moveTank(b,b.speed*3.4*dt); if(!moved) b.charge=0; b.mineT=(b.mineT||0)-dt;
    if(b.mineT<=0&&b.mines<10){ b.mineT=0.3; b.mines++; M.mines.push({x:b.x+32-DX[b.dir]*30,y:b.y+32-DY[b.dir]*30,team:'e',owner:b,arm:1,dmgP:2*M.dmgK}); }
    if(Math.random()<0.6) debris(b.x+32,b.y+32,1,'#555',60); M.shake=Math.max(M.shake,2); return; }
  const spd=b.speed*(kind==='fortress'?0.6:1)*(b.phase===2?1.3:1);
  b.dirT-=dt;
  if(b.dirT<=0||!moveTank(b,spd*dt)){
    b.dirT=rand(1.5,3); const tp=nearestPlayer(b);
    let tx=tp?tp.x-16:176, ty=rand(0,200); if(kind==='drill'&&Math.random()<0.3) ty=300;
    const dx=tx-b.x, dy=ty-b.y; let d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0); if(Math.random()<0.25)d=ri(4); if(b.y>250&&d===2)d=0; turn(b,d); }
  else if(Math.random()<0.02) decalTrack(b.x+32,b.y+32,b.dir*Math.PI/2,64);
  const tg=bossTarget(b);
  if(kind==='behemoth'){
    if(b.t1<=0){ b.t1=1.6*fast; aimedShot(b,tg.x,tg.y,210,mk>=2?7:5,0.2); }
    if(b.t2<=0){ b.t2=6*fast; ringShot(b,mk>=2?24:16,150); }
  } else if(kind==='fortress'){
    if(b.t1<=0){ b.t1=1.3*fast; for(const p of M.players) if(p&&p.state==='alive'){ aimedShot(b,p.x+16,p.y+16,230,1,0,-26,0); aimedShot(b,p.x+16,p.y+16,230,1,0,26,0); } if(!M.players.some(p=>p&&p.state==='alive')) aimedShot(b,208,400,230); }
    if(b.t2<=0){ b.t2=8*fast; let n=0; for(const sp of [[b.x-32,b.y+16],[b.x+64,b.y+16]]){ const x=clamp(Math.round(sp[0]/16)*16,0,384), y=clamp(Math.round(sp[1]/16)*16,0,384); if(n<2&&M.enemies.length<M.maxF+3&&tankRectFree({w:32,x:-99,y:-99},x,y)){ M.spawns.push({x,y,t:0.8,type:pickWeighted(M.weights),carrier:Math.random()<0.25}); n++; } } }
    if(b.phase===2&&b.t3<=0){ b.t3=5; ringShot(b,12,140); }
  } else if(kind==='phantom'){
    b.alpha=0.55+0.45*Math.abs(Math.sin(M.time*2));
    if(b.t1<=0){ b.t1=(mk>=2?0.45:0.55)*fast; aimedShot(b,tg.x,tg.y,260,b.phase===2?3:1,0.16,0,0,'#80e0ff'); }
    if(b.t2<=0){ b.t2=5*fast; for(let k=0;k<30;k++){ const x=ri(23)*16, y=ri(14)*16; if(tankRectFree({w:64,x:-200,y:-200},x,y)&&!M.players.some(p=>p&&dist(p.x,p.y,x,y)<90)){ teleportFx(b.x+32,b.y+32); b.x=x; b.y=y; teleportFx(x+32,y+32); SFX.tele(); break; } } }
  } else if(kind==='gunner'){
    if(b.t1<=0){ b.t1=2.6*fast; const tg2=[]; for(const p of M.players) if(p&&p.state==='alive') tg2.push([p.x+16,p.y+16]); tg2.push([208,400]); for(let k=0;k<(b.phase===2?4:2)+(mk>=2?1:0);k++) tg2.push([rand(20,396),rand(60,396)]);
      for(const[x,y] of tg2) M.strikes.push({x:x+rand(-8,8),y:y+rand(-8,8),r:24,t:1.5,max:1.5,team:'e',dmgP:1.6*M.dmgK,base:true}); SFX.mortar(); }
    if(b.t2<=0){ b.t2=4.5*fast; ringShot(b,12,150); }
  } else if(kind==='drill'){
    if(b.t1<=0){ b.t1=4*fast; const p=nearestPlayer(b); if(p){ const dx=p.x-b.x, dy=p.y-b.y; turn(b,Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)); b.charge=1.2; b.mines=0; SFX.dash(); } }
    if((b.phase===2||mk>=2)&&b.t2<=0){ b.t2=3.5; for(const s of [-1,1]){ M.bullets.push({alive:true,kind:'missile',x:b.x+32+s*20,y:b.y+32,ang:-Math.PI/2+s*0.6,spd:120,turn:2.4,life:4.5,team:'e',owner:b,dmg:1.5*M.dmgK,target:nearestPlayer(b),r:3,over:false}); } SFX.missile(); }
    if(b.t3<=0){ b.t3=2*fast; aimedShot(b,tg.x,tg.y,220,3,0.25); }
  }
}
function bossDeath(b){

const SPAWN_PTS=[[0,0],[192,0],[384,0]];
function updatePlay(dt){
  if(pressed.KeyP||pressed.Escape||padBtn('start')){ paused=!paused; pauseSel=0; }
  if(paused){ updatePause(); return; }
  M.time+=dt;
  for(const tm of timers){ tm.t-=dt; if(tm.t<=0){ tm.done=true; tm.fn(); } } timers=timers.filter(t=>!t.done);
  if(M.banner){ M.banner.t-=dt; if(M.banner.t<=0) M.banner=null; }
  // появление врагов
  M.spawnTimer-=dt;
  const endless=['survive','capture','escort','intercept'].includes(M.type);
  const more= M.type==='long'?false: M.type==='waves'?(M.phase==='fight'&&M.spawnIdx<M.queue.length): endless ? !M.ending&&!M.over : M.spawnIdx<M.queue.length;
  const SP=M.spawnPts||SPAWN_PTS, NSP=SP.length;
  if(!M.over&&more&&M.spawnTimer<=0&&M.enemies.length+M.spawns.length<M.maxF){
    const midOK=!!M.spawnPts||M.noBase||settings.spawn!==2||M.L>=85||(M.L>=45&&Math.random()<0.15+(M.L-45)*0.008);
    if(!M.spawnPts&&!M.noBase&&settings.spawn===1){ for(let k=0;k<14;k++){ const x=ri(Math.floor((FW-32)/16)+1)*16; if(spawnTerrFree(x)&&spotFree(x,0)&&!M.spawns.some(s=>Math.abs(s.x-x)<32&&s.y===0)){ const type=endless?pickWeighted(M.weights):M.queue[M.spawnIdx]; M.spawns.push({x,y:0,t:0.9,type,carrier:(M.spawnIdx%6===3)}); M.spawnIdx++; M.spawnTimer=M.spawnInt; break; } } }
    else for(let k=0;k<NSP;k++){ const pi=(M.spawnPt+k)%NSP, pt=SP[pi];
      if(!midOK&&SP===SPAWN_PTS&&pi===1) continue;
      if(spotFree(pt[0],pt[1])&&!M.spawns.some(s=>s.x===pt[0]&&s.y===pt[1])){
        const type=endless?pickWeighted(M.weights):M.queue[M.spawnIdx];
        M.spawns.push({x:pt[0],y:pt[1],t:0.9,type,carrier:(M.spawnIdx%6===3)}); M.spawnIdx++; M.spawnPt=(pi+1)%NSP; M.spawnTimer=M.spawnInt; break; } }
  }
  if(M.type==='boss'&&!M.bossSpawned&&M.time>4) spawnBoss();
  for(const s of M.spawns){ s.t-=dt; if(s.t<=0&&spotFree(s.x,s.y)){ const e=makeEnemy(s); onTwistSpawn(e,s); if(M.L<85) e.fireT+=M.L<45?1.6:0.8; if(s.guard) e.role='base'; if(M.long) e.role='hunter'; M.enemies.push(e); s.done=true;} }
  M.spawns=M.spawns.filter(s=>!s.done);
  for(const p of M.players) if(p) updatePlayer(p,dt);
  updateNav(dt);
  for(const e of M.enemies){ if(e.dead)continue; if(M.long&&(e.y<M.camY-100||e.y>M.camY+F+40)&&!e.boss)continue; if(e.monster) updateMonster(e,dt); else updateEnemy(e,dt); }
  // турели
  const tl=camp.base.turret, tdm=0.8*hpMul(M.L)*(1+0.2*Math.max(0,tl-2)), tcd=2.2/(1+0.1*Math.max(0,tl-2));
  for(const tu of M.turrets){ if(M.powerOff>0) continue; tu.cool-=dt; const tgt=nearestEnemy(tu.x+8,tu.y+8,230);
    if(tgt){ tu.ang+=clamp(angDiff(tu.ang,Math.atan2(tgt.y+tgt.w/2-tu.y-8,tgt.x+tgt.w/2-tu.x-8)),-6*dt,6*dt);
      if(tu.cool<=0){ M.bullets.push({alive:true,kind:'missile',x:tu.x+8,y:tu.y+8,ang:tu.ang,spd:200,turn:5,life:2.5,team:'t',owner:'turret',dmg:tdm,target:tgt,r:2.5,over:true}); tu.cool=tcd; SFX.missile(); } } }
  updateBullets(dt);
  if(M.bombs.length||M.flames.length) updateBombs(dt);
  if(M.bomber) updateBomber(dt);
  if(M.structs.length) updateStructs(dt);
  if(M.allies.length) updateAllies(dt);
  updateDrops(dt); updateCamera(dt);
  if(!M.ending&&!M.over){ if(M.type==='escort') updateEscort(dt); else if(M.type==='intercept') updateIntercept(dt); else if(M.type==='waves') updateWaves(dt); }
  if(M.props.some(p=>p.dead)) M.props=M.props.filter(p=>!p.dead);
  if(M.repairs.length) updateRepairs(dt);
  if(M.type==='capture'&&!M.ending&&!M.over) updateCaps(dt);
  if(M.duel) updateDuel(dt);
  // мины
  for(const mi of M.mines){ if(mi.dead)continue; mi.arm-=dt; if(mi.arm>0)continue;
    if(mi.team==='p'){ for(const e of M.enemies) if(!e.dead&&ptIn(mi.x,mi.y,e.x-4,e.y-4,e.w+8,e.w+8)){ mi.dead=true; blast(mi.x,mi.y,34,{dmgE:mi.dmgE,src:mi.owner,size:1}); break; } }
    else { for(const p of M.players) if(p&&p.state==='alive'&&p.dashT<=0&&ptIn(mi.x,mi.y,p.x-2,p.y-2,36,36)){ mi.dead=true; blast(mi.x,mi.y,30,{dmgP:mi.dmgP,size:0.9}); break; } } }
  M.mines=M.mines.filter(m=>!m.dead);
  // удары с неба
  for(const s of M.strikes){ s.t-=dt; if(s.t<=0){ s.done=true; blast(s.x,s.y,s.r+6,{dmgE:s.dmgE||(s.team==='n'?2*M.hpK:0),dmgP:s.friendly?0:s.dmgP,src:s.src||'env',base:s.base&&!s.friendly,size:1}); } }
  M.strikes=M.strikes.filter(s=>!s.done);
  if(M.mods.includes('barrage')){ M.barrageT-=dt; if(M.barrageT<=0){ M.barrageT=rand(2.5,5); const al=M.players.filter(p=>p&&p.state==='alive'); const p=al.length&&Math.random()<0.6?al[ri(al.length)]:null;
      const x=p?p.x+16+rand(-40,40):rand(20,396), y=p?p.y+16+rand(-40,40):M.camY+rand(40,330); M.strikes.push({x:clamp(x,10,406),y:clamp(y,10,FH-10),r:22,t:1.7,max:1.7,team:'n',dmgP:1.4*M.dmgK,dmgE:2*M.hpK,base:false}); } }
  for(const bm of M.beams) bm.t-=dt; M.beams=M.beams.filter(b=>b.t>0);
  for(const q of M.bolts) q.t-=dt; M.bolts=M.bolts.filter(q=>q.t>0); for(const q of M.rails) q.t-=dt; M.rails=M.rails.filter(q=>q.t>0); for(const q of M.sights) q.t-=dt; M.sights=M.sights.filter(q=>q.t>0);
  updateBurns(dt); updateMechanics(dt); updateHusks(dt);
  M.enemies=M.enemies.filter(e=>!e.dead);
  for(const b of M.bonuses){b.t+=dt;} M.bonuses=M.bonuses.filter(b=>!b.taken&&b.t<16);
  for(const t of M.texts){t.t-=dt;t.y-=dt*16;} M.texts=M.texts.filter(t=>t.t>0);
  updateParts(dt);
  M.shake=Math.max(0,M.shake-dt*20);
  if(M.freeze>0)M.freeze-=dt;
  if(M.baseFlash>0)M.baseFlash-=dt;
  if(camp.base.shield>0&&M.baseShield<camp.base.shield&&!(M.powerOff>0)){ M.baseShieldT+=dt; if(M.baseShieldT>=25/(1+0.3*camp.base.shield)){ M.baseShieldT=0; M.baseShield++; } }
  if(camp.base.walls>=2&&M.shovel<=0){ M.wallT-=dt; if(M.wallT<=0){ M.wallT=camp.base.walls>=3?7:10; setRing(ST,true); } }
  if(M.shovel>0){ M.shovel-=dt; if(M.shovel<=0) setRing(defaultRing()); }
  // конец
  if(M.type==='survive'&&!M.ending&&!M.over){ M.surviveT-=dt; if(M.surviveT<=0){ for(const e of M.enemies) if(!e.dead) killEnemy(e,'env'); M.spawns=[]; } }
  if(!M.ending&&!M.over&&!M.duel&&!M.bomber){
    if(M.type==='capture'&&M.capIdx>=M.caps.length){ for(const e of M.enemies) if(!e.dead) killEnemy(e,'env'); M.spawns=[]; M.ending=true; M.endT=3; }

let NG=25, NGH=25;
let navCost=new Int16Array(41*80), navDirty=true, navT=0, fieldBase=null, fieldP=[null,null,null,null], fieldPT=0;
function buildNav(){
  NGH=FH/16-1; NG=FW/16-1;
  for(let gy=0;gy<NGH;gy++)for(let gx=0;gx<NG;gx++){
    const x=gx*16,y=gy*16; let c=1, blocked=false;
    for(let cy=y/8;cy<y/8+4&&!blocked;cy++)for(let cx=x/8;cx<x/8+4;cx++){ const v=terr[cy*GW+cx]; if(v===ST||v===WA){blocked=true;break;} if(v===BR) c=6; }
    if(!blocked&&!M.noBase&&rectOv(x,y,32,32,192,384,32,32)) blocked=true;
    if(!blocked) for(const st of M.structs) if(!st.dead&&rectOv(x,y,32,32,st.x,st.y,st.w,st.h)){ blocked=true; break; }
    if(!blocked) for(const p of M.props) if(rectOv(x,y,32,32,p.x,p.y,16,16)){ c+=3; break; }
    navCost[gy*NG+gx]=blocked?-1:c;
  }
  navDirty=false;
}
function dijkstra(targets){
  const dist=new Float32Array(NG*NGH).fill(1e9), heap=[];
  const push=(n,d)=>{ heap.push([d,n]); let i=heap.length-1; while(i>0){ const p=(i-1)>>1; if(heap[p][0]<=heap[i][0])break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=i*2+1,r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0])m=l; if(r<heap.length&&heap[r][0]<heap[m][0])m=r; if(m===i)break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top; };
  for(const t of targets){ if(t<0||t>=NG*NGH)continue; dist[t]=0; push(t,0); }
  while(heap.length){ const [d,u]=pop(); if(d>dist[u])continue; const ux=u%NG, uy=(u/NG)|0;
    for(let k=0;k<4;k++){ const vx=ux+DX[k], vy=uy+DY[k]; if(vx<0||vy<0||vx>=NG||vy>=NGH)continue; const v=vy*NG+vx, c=navCost[v]; if(c<0)continue; const nd=d+c; if(nd<dist[v]){dist[v]=nd; push(v,nd);} } }
  return dist;
}
function updateNav(dt){
  navT-=dt; fieldPT-=dt;
  if(navDirty&&navT<1.0) navT=Math.min(navT,0.4);
  const dyn=M.noBase;
  if(navT<=0||!fieldBase){ buildNav(); if(!dyn) fieldBase=dijkstra([22*NG+12,22*NG+11,22*NG+13,24*NG+10,24*NG+14,23*NG+10,23*NG+14]); navT=1.5; fieldPT=0; }
  if(fieldPT<=0){
    if(dyn){ const tg=[]; const nodeOf=o=>Math.round(o.y/16)*NG+Math.round(o.x/16);
      if(M.truck&&!M.truck.dead) tg.push(nodeOf(M.truck));
      else if(M.etrucks&&M.etrucks.some(t=>!t.dead&&!t.escaped)) for(const t of M.etrucks){ if(!t.dead&&!t.escaped) tg.push(nodeOf(t)); }
      else for(const p of M.players) if(p&&p.state==='alive') tg.push(nodeOf(p));
      fieldBase=tg.length?dijkstra(tg):(fieldBase||new Float32Array(NG*NGH).fill(1e9)); } for(let i=0;i<4;i++){ const p=M.players[i]; fieldP[i]=(p&&p.state==='alive')?dijkstra([Math.round(p.y/16)*NG+Math.round(p.x/16)]):null; } fieldPT=0.6; }
}
const DODGE=[0.15,0.55,0.3,0.05,0.2,0.25,0.1,0,0.1,0.35,0.45,0.3,0.55,0.5,0.2,0.4,0.1,0.3];
const HUNT=[0.25,0.6,0.35,0.2,0.4,0.15,0.3,1,0,0,0.7,0.5,0.5,0.8,0.9,0.5,0.1,0.4];
function aiField(e){
  if(e.role==='hunter'){ let best=null,bd=1e9; for(let i=0;i<4;i++){ const p=M.players[i]; if(p&&p.state==='alive'&&fieldP[i]){ const d=Math.abs(p.x-e.x)+Math.abs(p.y-e.y); if(d<bd){bd=d;best=i;} } } if(best!=null) return fieldP[best]; }
  return fieldBase;
}
// возвращает true, если ИИ сам управлял движением
function aiDrive(e,sp,dt){
  if(!fieldBase) return false;
  if(e.dodgeT>0){ e.dodgeT-=dt; if(!moveTank(e,sp*dt)) e.dodgeT=0; return true; }
  // уклонение
  e.dodgeCd=(e.dodgeCd||0)-dt;
  if(e.dodgeCd<=0){ const cx=e.x+16, cy=e.y+16;
    for(const b of M.bullets){ if(b.team!=='p'||b.kind!=='shell'||b.dir<0||!b.alive)continue;
      const toward=(b.dir===0&&b.y>cy&&Math.abs(b.x-cx)<14&&b.y-cy<110)||(b.dir===2&&b.y<cy&&Math.abs(b.x-cx)<14&&cy-b.y<110)||(b.dir===1&&b.x<cx&&Math.abs(b.y-cy)<14&&cx-b.x<110)||(b.dir===3&&b.x>cx&&Math.abs(b.y-cy)<14&&b.x-cx<110);
      if(toward){ e.dodgeCd=1.1; const skill=DODGE[e.type]*(diffOf().hp>1.2?1.4:diffOf().hp<0.9?0.5:1);
        if(Math.random()<skill){ const opts=[(b.dir+1)%4,(b.dir+3)%4].filter(d=>tankRectFree(e,e.x+DX[d]*4,e.y+DY[d]*4)); if(opts.length){ turn(e,opts[ri(opts.length)]); e.dodgeT=0.3; e.lastNode=-1; return true; } } break; } } }
  const f=aiField(e), gx=Math.round(e.x/16), gy=Math.round(e.y/16), node=gy*NG+gx;
  const aligned=Math.abs(e.x-gx*16)<1.1&&Math.abs(e.y-gy*16)<1.1;
  if(aligned&&node!==e.lastNode){
    e.lastNode=node; e.wantBreak=false;
    if(f[node]===0){ // прибыл: смотрим на цель и стреляем
      if(e.role!=='hunter'){ const dx=208-(e.x+16), dy=400-(e.y+16); turn(e,Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)); e.holdT=1; }
      return true; }
    let best=-1, bs=1e9; const noise=e.type===1?3:1.5;
    for(let d=0;d<4;d++){ const nx=gx+DX[d], ny=gy+DY[d]; if(nx<0||ny<0||nx>=NG||ny>=NGH)continue; const n=ny*NG+nx; if(navCost[n]<0||f[n]>=1e9)continue;
      let sc=f[n]+Math.random()*noise+(d===(e.dir+2)%4?2:0);
      for(const o of M.enemies) if(o!==e&&!o.dead&&Math.abs(o.x-nx*16)<20&&Math.abs(o.y-ny*16)<20) sc+=6;
      if(sc<bs){bs=sc;best=d;} }
    if(best>=0){ turn(e,best); const n=(gy+DY[best])*NG+gx+DX[best]; e.wantBreak=navCost[n]>=6; }
  }
  if(e.holdT>0){ e.holdT-=dt; if(e.cool<=0) enemyShoot(e); return true; }
  if(moveTank(e,sp*dt)){ e.blockedT=0; }
  else { e.blockedT+=dt;
    if(e.wantBreak||e.blockedT>0.15){ if(e.cool<=0) enemyShoot(e); }
    if(e.blockedT>(e.wantBreak?2.5:0.5)){ e.blockedT=0; e.lastNode=-1; const d=ri(4); turn(e,d); e.dodgeT=0.25; } }
  return true;
}

function genArena(L){
  const kind=bossFor(L).kind, r=mulberry32(L*313+9), B=new Array(169).fill(null);
  const put=(x,y,t,part='f')=>{ if(x>=0&&x<13&&y>=0&&y<13) B[y*13+x]={t,part}; };
  const sym=(x,y,t,part='f')=>{ put(x,y,t,part); put(12-x,y,t,part==='l'?'r':part==='r'?'l':part); };
  if(kind==='behemoth'){ for(const[x,y] of [[2,3],[2,7]]){ sym(x,y,BR);sym(x+1,y,BR);sym(x,y+1,BR);sym(x+1,y+1,BR);} sym(5,5,FO); sym(4,5,FO); sym(1,10,FO); sym(0,10,FO); put(6,6,ST,'hb'); sym(5,9,BR,'b'); }
  else if(kind==='fortress'){ for(let x=1;x<=4;x++) sym(x,4,BR); for(let x=0;x<=2;x++) sym(x,8,BR); sym(4,8,BR); sym(5,8,BR,'b'); sym(1,4,ST,'t'); sym(3,6,FO); sym(2,6,FO); }
  else if(kind==='phantom'){ for(const[x,y] of [[2,2],[2,6],[4,4],[4,8],[1,9]]) sym(x,y,ST,'hb'); for(let y=2;y<10;y++)for(let x=0;x<13;x++) if(!B[y*13+x]&&(x+y)%3!==0) put(x,y,IC); put(6,6,ST); }
  else if(kind==='gunner'){ for(let k=0;k<9;k++){ const x=Math.floor(r()*6), y=2+Math.floor(r()*8); sym(x,y,BR,['l','r','t','b'][Math.floor(r()*4)]); } for(let y=4;y<=6;y++){ sym(0,y,WA); } sym(3,9,FO); sym(4,9,FO); }
  else if(kind==='drill'){ for(let y=3;y<=8;y++)for(let x=0;x<=5;x++) if(r()<0.62) sym(x,y,BR); sym(0,2,ST); sym(0,9,ST); }
  else { for(let x=3;x<=9;x++){ if(x!==6){ put(x,3,ST,'b'); put(x,8,ST,'t'); } } for(let y=4;y<=7;y++){ if(y!==5){ put(3,y,ST,'r'); put(9,y,ST,'l'); } } for(const[x,y] of [[0,4],[0,5],[0,6],[12,4],[12,5],[12,6]]) put(x,y,WA); for(let y=4;y<=7;y++)for(let x=4;x<=8;x++) if(r()<0.35) put(x,y,BR); }
  for(const[x,y] of [[0,0],[6,0],[12,0],[0,1],[6,1],[12,1],[4,12],[8,12],[4,11],[8,11],[5,0],[7,0],[5,1],[7,1]]) B[y*13+x]=null;
  for(let y=10;y<13;y++)for(let x=5;x<8;x++) if(y>10) B[y*13+x]=null;
  return {B,props:[],teles:[],repairs:[]};
}

function pickCaps(lv,L){
  const r=mulberry32(L*71+3), cand=[];
  for(let y=2;y<=8;y++)for(let x=0;x<13;x++){ const b=lv.B[y*13+x]; if(!b||b.t===FO||b.t===IC||b.t===MU) cand.push([x,y]); }
  const out=[];
  for(let k=0;k<200&&out.length<3;k++){ const c=cand[Math.floor(r()*cand.length)]; if(!c)break; if(out.every(o=>Math.abs(o[0]-c[0])+Math.abs(o[1]-c[1])>=5)) out.push(c); }
  while(out.length<3) out.push([[2,4],[10,4],[6,7]][out.length]);
  return out.map(([x,y])=>({x:x*32+16,y:y*32+16,prog:0,done:false}));
}
function updateCaps(dt){
  const c=M.caps[M.capIdx]; if(!c) return;
  let pin=0, ein=0;
  for(const p of M.players) if(p&&p.state==='alive'&&dist(p.x+16,p.y+16,c.x,c.y)<30) pin++;
  for(const e of M.enemies) if(!e.dead&&dist(e.x+e.w/2,e.y+e.w/2,c.x,c.y)<30) ein++;
  c.contested=pin>0&&ein>0;
  if(pin>0&&ein===0){ c.prog+=dt/7*(pin>1?1.5:1); if(Math.random()<0.3) addP({x:c.x+rand(-20,20),y:c.y+rand(-20,20),vx:0,vy:-30,life:0.6,max:0.6,size:4,type:'glow',col:'rgba(120,200,255,A)'}); }
  else if(pin===0&&c.prog>0) c.prog=Math.max(0,c.prog-dt/20);
  if(c.prog>=1){ c.done=true; M.capIdx++; SFX.win(); M.banner={t:2,title:'ТОЧКА ЗАХВАЧЕНА '+M.capIdx+'/3',sub:M.capIdx<3?'Следующая точка отмечена на карте':'',col:'#60c0ff'}; explosion(c.x,c.y,0.6); }
}

function makeContract(L,type){
  if(M.custom||M.duel||M.bomber) return null;
  const r=mulberry32(L*7919+(M.daily?99:0)+(M.defense?Date.now()%1000:0)), opts=[];
  const types=ET.filter(e=>M.weights[e.id]>0.04&&e.id!==7);
  if(types.length){ const e=types[Math.floor(r()*types.length)]; const n=Math.max(3,Math.round(4+L/15)); opts.push({kind:'kill',type:e.id,need:n,text:'Уничтожь '+n+': '+e.name,k:1.0}); }
  if(!M.noBase&&type!=='waves') opts.push({kind:'nobase',need:1,text:'Штаб без урона',k:1.3});
  opts.push({kind:'nodeath',need:1,text:'Без потерь танков',k:1.2});
  opts.push({kind:'combo',need:L<20?5:L<50?7:10,text:'Серия убийств x'+(L<20?5:L<50?7:10),k:1.1});
  opts.push({kind:'ult',need:3,text:'3 убийства в ярости',k:1.0});
  opts.push({kind:'ram',need:L<30?2:4,text:'Тарань рывком: '+(L<30?2:4),k:0.9});
  if(type==='assault'){ const T=Math.round(40+M.queue.length*5.5); opts.push({kind:'time',need:T,text:'Пройди быстрее '+T+' с',k:1.3}); }
  const c=opts[Math.floor(r()*opts.length)]; c.prog=0; c.fail=false; c.reward=Math.round(120*(1+0.09*L)*c.k/5)*5; return c;
}
function contractDone(){ const c=M.contract; if(!c||c.fail) return false;
  if(c.kind==='nobase') return M.baseHpLost===0||!M.baseHpLost; if(c.kind==='nodeath') return M.lost===0; if(c.kind==='time') return M.time<=c.need; return c.prog>=c.need; }
function contractText(){ const c=M.contract; if(!c) return ''; const ok=contractDone(); const pr=['nobase','nodeath','time'].includes(c.kind)?(c.kind==='time'?Math.max(0,Math.ceil(c.need-M.time))+'с':(ok?'держится':'провал')):Math.min(c.prog,c.need)+'/'+c.need; return {t:c.text,p:pr,ok:ok&&!['nobase','nodeath','time'].includes(c.kind),fail:!ok&&['nobase','nodeath'].includes(c.kind)||(c.kind==='time'&&M.time>c.need)}; }

  for(const e of M.enemies) if(!e.dead&&!e.boss&&!e.heli&&wet(e)){ ftext(e.x+16,e.y,'УТОНУЛ!','#80c0ff',10); puff(e.x+16,e.y+16,10,'rgba(120,170,230,',6,40,1); killEnemy(e,src&&src.isPlayer?src:'env'); }
  for(const p of M.players) if(p&&p.state==='alive'&&!p.hover&&wet(p)){ ftext(p.x+16,p.y,'УТОНУЛ!','#80c0ff',10); p.shield=0; p.bshield=0; p.es=0; hurtPlayer(p,999); }
}

function nudgeOut(sx,sy){ for(const t of M.players) if(t&&t.state==='alive'&&rectOv(t.x,t.y,32,32,sx,sy,32,32)){ let done=false; for(let r=16;r<=96&&!done;r+=16) for(const [dx,dy] of [[0,r],[0,-r],[r,0],[-r,0],[r,r],[-r,r],[r,-r],[-r,-r]]){ const nx=Math.round((t.x+dx)/16)*16, ny=Math.round((t.y+dy)/16)*16; if(tankRectFree({w:32,x:-999,y:-999,isPlayer:false},nx,ny)){ t.x=nx; t.y=ny; done=true; break; } } } }

STRUCT_DEF.cage={w:32,h:32,hp:3,pts:0};
function pickTwist(L,type){
  M.twist=null; M.twistT=rand(28,48);
  if(M.custom||M.duel||M.bomber||M.defense||type==='boss'||type==='race'||L<8) return;
  const r=Math.random(); if(r>0.55) { maybeCages(L,type); return; }
  const el=[];
  if(type==='assault'&&!M.noBase&&L>=12) el.push('evac');
  if(!M.noBase&&L>=10) el.push('tunnel');
  if(type!=='long') el.push('collapse');
  if(!M.noBase&&(camp.base.turret>0||camp.base.shield>0)) el.push('power');
  if(type==='assault'&&L>=10) el.push('commander');
  if(L>=20) el.push('ace');
  if(el.length) M.twist=el[ri(el.length)];
  if(M.twist==='commander'){ M.twistT=7; }
  maybeCages(L,type);
}
function maybeCages(L,type){
  if(M.custom||type==='boss'||type==='race'||L<6||Math.random()>0.35) return;
  const n=1+(Math.random()<0.4?1:0); let k=0;
  for(let t=0;t<80&&k<n;t++){ const x=ri(13)*32, y=type==='long'?ri(Math.floor(FH/32)-6)*32+96:(2+ri(7))*32;
    if(!tankRectFree({w:32,x:-99,y:-99},x,y)) continue; if(M.structs.some(s=>rectOv(x-32,y-32,96,96,s.x,s.y,s.w,s.h))) continue;
    const s=addStruct('cage',x,y); s.hp=s.maxHp=2+L*0.08; s.prisoner=[0,1,3,6][ri(4)]; k++; }
}

function doCollapse(){
  const rows=Math.floor(FH/32), y0=Math.max(2,Math.floor(M.camY/32)+2), y1=Math.min(rows-3,Math.floor(M.camY/32)+9);
  let ch=0;
  for(let t=0;t<60&&ch<11;t++){ const bx=ri(13), by=y0+ri(Math.max(1,y1-y0+1)); const x=bx*32, y=by*32;
    if(M.players.some(p=>p&&rectOv(p.x,p.y,32,32,x,y,32,32))||M.enemies.some(e=>!e.dead&&rectOv(e.x,e.y,e.w,e.w,x,y,32,32))||M.structs.some(s=>!s.dead&&rectOv(s.x,s.y,s.w,s.h,x,y,32,32))) continue;
    if(!M.noBase&&rectOv(x,y,32,32,160,352,96,64)) continue;
    let st=0,br=0,em=0; for(let yy=by*4;yy<by*4+4;yy++)for(let xx=bx*4;xx<bx*4+4;xx++){ const v=tget(xx,yy); if(v===ST)st++; else if(v===BR)br++; else if(v===E)em++; }
    let mode=null; if(st>=8) mode='crack'; else if(br>=6) mode=Math.random()<0.7?'open':null; else if(em===16) mode=Math.random()<0.45?'rubble':null;
    if(!mode) continue;
    for(let yy=by*4;yy<by*4+4;yy++)for(let xx=bx*4;xx<bx*4+4;xx++){ const v=tget(xx,yy); if(mode==='crack'&&v===ST&&!isTurretCell(xx,yy)) tset(xx,yy,BR); else if(mode==='open'&&v===BR) tset(xx,yy,E); else if(mode==='rubble'&&Math.random()<0.75) tset(xx,yy,BR); }
    puff(x+16,y+16,8,'rgba(150,130,100,',7,40,1.2); debris(x+16,y+16,6,curTheme.brick[0],90); ch++; }
  M.shake=10; SFX.bigboom(); ftext(FW/2,M.camY+200,'КАРТА ИЗМЕНИЛАСЬ!','#d0a060',12);
}

function setupTrain(L,type){
  M.train=null;
  if(M.custom||M.bomber||M.duel||type==='boss'||type==='long'||type==='race'||L<9) return;
  if(!(L>=25&&L%10===7)&&mulberry32(L*131+7)()>0.38) return;
  const r=mulberry32(L*977+19), q=v=>Math.round(v/16)*16;
  const y0=q(96+r()*176), turn=r()<0.65, x1=q(96+r()*224), y1=turn?clamp(q(y0+(r()<0.5?-1:1)*(64+r()*96)),64,288):y0;
  const fromLeft=r()<0.5;
  let pts=[[-60,y0],[x1,y0],[x1,y1],[FW+420,y1]];
  if(!fromLeft) pts=[[FW+30,y0],[FW-32-x1,y0],[FW-32-x1,y1],[-420,y1]];
  // расчистить полосу
  for(let i=0;i<pts.length-1;i++){ const [ax,ay]=pts[i],[bx,by]=pts[i+1]; const x0=clamp(Math.min(ax,bx),0,FW-32), xe=clamp(Math.max(ax,bx),0,FW-32), yA=Math.min(ay,by), yB=Math.max(ay,by);
    for(let yy=yA/8;yy<(yB+32)/8;yy++)for(let xx=x0/8;xx<(xe+32)/8;xx++) if(yy>=0&&yy<GH&&xx>=0&&xx<GW){ const v=terr[yy*GW+xx]; if(v!==E) terr[yy*GW+xx]=v===WA?BG:E; } }
  const segs=[]; let len=0; for(let i=0;i<pts.length-1;i++){ const [ax,ay]=pts[i],[bx,by]=pts[i+1], l=Math.abs(bx-ax)+Math.abs(by-ay); segs.push({ax,ay,bx,by,l,s0:len}); len+=l; }
  const onTrack=(x,y,w,h)=>segs.some(s=>rectOv(x,y,w,h,Math.min(s.ax,s.bx),Math.min(s.ay,s.by),Math.abs(s.bx-s.ax)+32,Math.abs(s.by-s.ay)+32));
  M.props=M.props.filter(p=>!onTrack(p.x,p.y,16,16)); M.repairs=M.repairs.filter(p=>!onTrack(p.x,p.y,32,32)); M.teles=M.teles.filter(p=>!onTrack(p.x,p.y,32,32)); M.structs=M.structs.filter(s=>s.kind!=='cage'||!onTrack(s.x,s.y,32,32));
  M.train={segs,len,cars:6+Math.floor(r()*4)+(L>=50?2:0),sp:150+Math.min(70,L),s:-1,t:rand(12,22),warn:0,onTrack,fromLeft};
  wallsDirty=true; navDirty=true; drawRails();
}
function drawRails(){ const tr=M.train; if(!tr) return; const c=gctx;

function gMsg(i,s){GR.msg[i]=s;GR.msgT[i]=1.8;}
function gBuy(i,row){
  const cp=camp.p[i];
  const pay=price=>{ if(cp.credits<price){SFX.deny();gMsg(i,'Не хватает '+fmt(price-cp.credits)+' $');return false;} cp.credits-=price; SFX.buy(); return true; };
  if(row.k==='up'){ const l=cp.up[row.u.key]; if(pay(upPrice(row.u.base,l))){ cp.up[row.u.key]++; gMsg(i,row.u.name+' → '+(l+1)+' ур.'); if(tierOf(l+1)>tierOf(l)){ gMsg(i,row.u.name+': НОВЫЙ ВИД!'); SFX.bonus(); } } }
  else if(row.k==='hull'){ const h=HULLS[GR.hs[i]]; if(h.trophy&&!cp.hulls.includes(h.id)&&!(meta.trophies&&meta.trophies[h.id])){ SFX.deny(); gMsg(i,'Трофей: победи босса (50+ миссия)'); return; } if(cp.hulls.includes(h.id)){ cp.hull=h.id; SFX.buy(); gMsg(i,'Корпус: '+h.name); } else if(pay(h.price)){ cp.hulls.push(h.id); cp.hull=h.id; gMsg(i,'Куплен '+h.name+'!'); } }
  else if(row.k==='ab'){ const a=ABILITIES[GR.as[i]]; if(a.unlock&&camp.level<a.unlock&&!cp.abs.includes(a.id)){ SFX.deny(); gMsg(i,'Откроется с '+a.unlock+'-й миссии'); return; } if(cp.abs.includes(a.id)){ cp.ab=a.id; SFX.buy(); gMsg(i,'Способность: '+a.name); } else if(pay(a.price)){ cp.abs.push(a.id); cp.ab=a.id; gMsg(i,'Куплено: '+a.name); } }
  else if(row.k==='perks'){ GR.page[i]='perks'; GR.pc[i]=0; SFX.move(); }
  else if(row.k==='skin'){ const sk=SKINS[GR.ss[i]]; if(skinUnlocked(sk.id)){ cp.skin=sk.id; SFX.buy(); gMsg(i,'Окраска: '+sk.name); } else { SFX.deny(); const a=ACH.find(x=>x.skin===sk.id); gMsg(i,'Открой: '+(a?a.name:'?')); } }
  else if(row.k==='life'){ if(!cp.out&&cp.lives>=9){SFX.deny();gMsg(i,'Максимум 9');return;} if(pay(LIFE_PRICE)){ if(cp.out)cp.out=false; else cp.lives++; gMsg(i,'Танк в строю'); } }
  else if(row.k==='base'){ const l=camp.base[row.u.key]; if(l>=row.u.max){SFX.deny();gMsg(i,'Максимум');return;} if(pay(upPrice(row.u.base,l))){ camp.base[row.u.key]++; gMsg(i,row.u.name+' → '+(l+1)); } }
  else if(row.k==='ready'){ GR.ready[i]=!GR.ready[i]; SFX.move(); }
}
function updateGarage(dt){

      if(hit(i,'fire')){ GR.last=i; if(GR.pc[i]===PERKS.length){ GR.page[i]='main'; SFX.move(); } else { const pk=PERKS[GR.pc[i]], l=perk(cp,pk.id); if(l>=3){SFX.deny();gMsg(i,'Максимум');} else if(cp.pp<=0){SFX.deny();gMsg(i,'Нет очков навыков');} else { cp.perks[pk.id]=l+1; cp.pp--; SFX.bonus(); gMsg(i,pk.name+' '+(l+1)); } } }
      if(hit(i,'alt')){ GR.page[i]='main'; SFX.move(); }
      continue; }
    if(hit(i,'up')){ GR.c[i]=(GR.c[i]+rows.length-1)%rows.length; GR.last=i; SFX.move(); }
    if(hit(i,'down')){ GR.c[i]=(GR.c[i]+1)%rows.length; GR.last=i; SFX.move(); }
    const r=rows[GR.c[i]];
    if(r.k==='hull'||r.k==='ab'||r.k==='skin'){ const n=r.k==='hull'?HULLS.length:r.k==='ab'?ABILITIES.length:SKINS.length, arr=r.k==='hull'?GR.hs:r.k==='ab'?GR.as:GR.ss;
      if(hit(i,'left')){ arr[i]=(arr[i]+n-1)%n; SFX.move(); GR.last=i; } if(hit(i,'right')){ arr[i]=(arr[i]+1)%n; SFX.move(); GR.last=i; } }
    if(hit(i,'fire')){ GR.last=i; gBuy(i,r); if(state!=='garage')return; }
    if(hit(i,'alt')&&GR.ready[i]){ GR.ready[i]=false; SFX.move(); }

}

function damageFx(t,hp,max){ if(LOWFX()||!t||max<=0) return; const k=hp/max; const cx=t.x+(t.w||32)/2, cy=t.y+(t.w||32)/2;
  if(k<0.55&&Math.random()<(k<0.3?0.35:0.15)) addP({x:cx+rand(-6,6),y:cy+rand(-6,6),vx:rand(-5,5),vy:rand(-25,-12),life:1,max:1,size:2.5,grow:8,type:'smoke',col:k<0.3?'rgba(30,28,26,':'rgba(90,88,84,'});
  if(k<0.3&&Math.random()<0.3) addP({x:cx+rand(-7,7),y:cy+rand(-7,7),vx:0,vy:-15,life:0.3,max:0.3,size:3.5,type:'fire',drag:1});
  if(k<0.3&&Math.random()<0.06) sparks(cx+rand(-8,8),cy+rand(-8,8),3,'#ffe090',90,0.25); }
// ---------- окружение: пыль из-под гусениц, листва ----------
function envFx(t){ if(LOWFX()||!gfxOn()||!t.moving&&!(t.speed&&!t.isPlayer)) return; const fl=floorAt(t), cx=t.x+16, cy=t.y+16;
  if(Math.random()<0.12){ const col=fl===IC?'rgba(220,235,255,':fl===MU?'rgba(80,60,40,':/ПУСТЫН/.test(curTheme.name||'')?'rgba(200,170,120,':/ЗИМ/.test(curTheme.name||'')?'rgba(240,245,255,':'rgba(130,115,95,'; addP({x:cx-DX[t.dir]*14+rand(-8,8),y:cy-DY[t.dir]*14+rand(-8,8),vx:-DX[t.dir]*rand(5,15),vy:-DY[t.dir]*rand(5,15),life:0.7,max:0.7,size:2,grow:7,type:'smoke',col}); }
  if(Math.random()<0.25){ const x0=Math.floor(t.x/T), y0=Math.floor(t.y/T); let fo=false; for(let yy=y0;yy<y0+4&&!fo;yy++)for(let xx=x0;xx<x0+4;xx++) if(tget(xx,yy)===FO){ fo=true; break; } if(fo) addP({x:cx+rand(-14,14),y:cy+rand(-14,14),vx:rand(-30,30),vy:rand(-30,30),life:0.9,max:0.9,size:1.6+Math.random(),type:'debris',col:Math.random()<0.5?'#3a7a30':'#5a9a40',drag:2,rot:rand(0,6),vr:rand(-10,10)}); } }

gfxInit();

</script>
